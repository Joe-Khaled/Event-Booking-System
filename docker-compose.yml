services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-booking-system
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "3000:3000"
    networks:
      - event-booking-network

  postgres:
    image: postgres:17-alpine
    container_name: event-booking-postgres
    environment:
      - POSTGRES_DB=event_management
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5433:5432"
    volumes:
      - postgres_nodejs_data:/var/lib/postgresql/data
    networks:
      - event-booking-network
  nginx:
    image: nginx:alpine
    container_name: event-booking-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - webroot:/var/www/html
    depends_on:
      - app
    networks:
      - event-booking-network
volumes:
  postgres_nodejs_data:
networks:
  event-booking-network:
    driver: bridge
  